<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex,follow">
  <title>{{VOICE_TITLE}}｜Dr.core 自重ストレッチ</title>
  <meta name="description" content="Dr.core 自重ストレッチのお客様の声。提供された確認用のサンプル原稿を掲載しています。">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{VOICE_TITLE}}｜Dr.core 自重ストレッチ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/recovery.css">
  <link rel="stylesheet" href="../../assets/voices.css">
{{ORIGIN_META}}
</head>
<body class="voice-page" data-program="Recovery" data-voice-id="{{VOICE_ID}}">
  <a class="skip-link" href="#main">本文へスキップ</a>
  <header class="site-header voice-header">
    <div class="wrap header-inner">
      <a class="brand" href="../../#top" aria-label="Dr.core 自重ストレッチ トップ"><img src="../../assets/logo-dark.svg" width="1691" height="393" alt="Dr.core"><span>Recovery<small>自重ストレッチ</small></span></a>
      <a class="voice-header-link" href="../../#voices">お客様の声<span>一覧へ</span></a>
    </div>
  </header>
  <main id="main" class="voice-article-wrap">
    <nav class="voice-breadcrumb" aria-label="パンくずリスト"><a href="../../#top">トップ</a><span aria-hidden="true"> / </span><a href="../../#voices">お客様の声</a></nav>
    {{VOICE_SAMPLE_NOTICE}}
    <article class="voice-article">
      <header class="voice-article-heading">
        <p class="voice-article-eyebrow">お客様の声</p>
        <h1>{{VOICE_TITLE}}</h1>
        <p class="voice-article-identity">{{VOICE_IDENTITY}}</p>
        <p class="voice-article-theme"><span>テーマ</span>{{VOICE_THEME}}</p>
        <dl class="voice-article-concerns"><div><dt>主な悩み</dt><dd>{{VOICE_CONCERNS}}</dd></div></dl>
      </header>
      {{VOICE_PHOTO}}
      <div class="voice-article-body">{{VOICE_BODY}}</div>
    </article>
    <div class="voice-article-actions">
      <a class="button" href="../../#trial" data-position="voice-article">初回体験予約 <span aria-hidden="true">→</span></a>
      <a class="voice-back-link" href="../../#voices"><span aria-hidden="true">←</span> お客様の声一覧に戻る</a>
    </div>
  </main>
  <footer class="site-footer"><div class="wrap"><p class="copyright">© 2026 Dr.core All Rights Reserved.</p></div></footer>
</body>
</html>
